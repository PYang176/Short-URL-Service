name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: short_url
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      APP_ENV: test
      JWT_SECRET: test-jwt-secret-at-least-32-characters
      ANALYTICS_HASH_SECRET: test-analytics-secret-at-least-32-chars
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci
      REDIS_ADDR: 127.0.0.1:6379
      SHORTURL_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: Apply migrations
        run: go run ./cmd/migrate up
      - name: Integration tests
        run: go test -tags=integration ./...

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: short_url
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      APP_ENV: test
      PUBLIC_BASE_URL: http://127.0.0.1:5173
      JWT_SECRET: test-jwt-secret-at-least-32-characters
      ANALYTICS_HASH_SECRET: test-analytics-secret-at-least-32-chars
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci
      REDIS_ADDR: 127.0.0.1:6379
      DOMAIN_VERIFY_MODE: mock
      CUSTOM_DOMAIN_CNAME: links.localhost
      WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"
      SHORTURL_WEBHOOK_TARGET_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          go mod download
          cd web
          npm ci --no-audit --no-fund
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Apply migrations
        run: go run ./cmd/migrate up
      - name: Build services
        run: |
          go build -o /tmp/shorturl-api ./cmd/api
          go build -o /tmp/shorturl-worker ./cmd/worker
      - name: Start services
        run: |
          HTTP_ADDR=:18080 /tmp/shorturl-api > /tmp/api.log 2>&1 &
          HTTP_ADDR=:18081 /tmp/shorturl-worker > /tmp/worker.log 2>&1 &
          cd web
          npm run dev > /tmp/web.log 2>&1 &
          cd ..
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:18081/health/live >/dev/null \
              && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          cat /tmp/worker.log
          cat /tmp/web.log
          exit 1
      - name: Browser E2E
        run: python web/scripts/e2e.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: web/.tmp/playwright
          if-no-files-found: ignore
