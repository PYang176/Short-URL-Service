openapi: 3.1.0
info:
  title: Short URL Service API
  version: 1.0.0
  description: |
    短链接平台 HTTP API。用户接口使用 Bearer Access Token；
    短链与分析资源还可以使用带作用域的 API Key。
    域名、API Key 和 Webhook 管理接口只允许平台管理员 JWT。
servers:
  - url: /
security:
  - BearerAuth: []
tags:
  - name: Trial
  - name: Links
  - name: Analytics
  - name: API Keys
  - name: Webhooks
  - name: Abuse
paths:
  /api/v1/trial/links:
    get:
      tags: [Trial]
      summary: 读取当前游客 Cookie 下的试用短链
      security: []
      responses:
        "200":
          description: 游客链接与剩余额度
    post:
      tags: [Trial]
      summary: 无需登录创建短期短链
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrialLinkRequest"
      responses:
        "201":
          description: 试用短链已创建
        "429":
          description: 达到链接或请求额度
  /api/v1/trial/claim:
    post:
      tags: [Trial]
      summary: 注册后将游客短链认领到当前工作空间
      responses:
        "200":
          description: 认领结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialClaimResponse"
  /api/v1/links:
    get:
      tags: [Links]
      summary: 查询工作空间短链
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 链接列表
    post:
      tags: [Links]
      summary: 创建短链
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: 链接已创建
        "409":
          description: 短码冲突或幂等键内容不一致
  /api/v1/analytics/overview:
    get:
      tags: [Analytics]
      summary: 查询工作空间整体分析
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: 工作空间总量、趋势和热门链接
  /api/v1/analytics/export:
    get:
      tags: [Analytics]
      summary: 流式导出点击明细 CSV
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: link_id
          in: query
          schema:
            type: string
          description: 为空时导出整个工作空间
        - name: visitor
          in: query
          schema:
            type: string
            enum: [all, human, bot]
            default: all
        - name: device
          in: query
          schema:
            type: string
            enum: [desktop, mobile, tablet]
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - name: browser
          in: query
          schema:
            type: string
        - name: utm_source
          in: query
          schema:
            type: string
        - name: referrer
          in: query
          schema:
            type: string
      responses:
        "200":
          description: UTF-8 CSV 点击明细，不包含原始 IP 或访客哈希
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: 导出筛选参数无效
        "404":
          description: 指定短链不存在
  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: 查询当前工作空间 API Key
      description: 仅平台管理员可访问。
      responses:
        "200":
          description: API Key 元数据列表
        "403":
          description: 当前账号不是平台管理员
    post:
      tags: [API Keys]
      summary: 创建 API Key，明文 Secret 只返回一次
      description: 仅平台管理员可访问。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API Key 与只显示一次的 Secret
        "403":
          description: 当前账号不是平台管理员
  /api/v1/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: 撤销 API Key
      description: 仅平台管理员可访问。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已撤销
        "404":
          description: API Key 不存在
        "403":
          description: 当前账号不是平台管理员
  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      summary: 查询当前工作空间 Webhook 端点
      description: 仅平台管理员可访问。
      responses:
        "200":
          description: Webhook 端点列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEndpoint"
        "403":
          description: 当前账号不是平台管理员
    post:
      tags: [Webhooks]
      summary: 创建 Webhook 端点，签名 Secret 只返回一次
      description: 仅平台管理员可访问。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Webhook 端点与只显示一次的签名 Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWebhookResponse"
        "400":
          description: URL 格式无效或目标地址违反安全策略
        "403":
          description: 当前账号不是平台管理员
  /api/v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: 停用 Webhook 端点并终止待投递任务
      description: 仅平台管理员可访问。
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "204":
          description: 已停用
        "404":
          description: Webhook 不存在
        "403":
          description: 当前账号不是平台管理员
  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: 查询端点近期 Outbox 投递记录
      description: 仅平台管理员可访问。
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 投递记录列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
        "403":
          description: 当前账号不是平台管理员
  /api/v1/abuse/reports:
    post:
      tags: [Abuse]
      summary: 公开提交违规短链举报
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbuseReportRequest"
      responses:
        "201":
          description: 举报已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAbuseReportResponse"
        "404":
          description: 短链不存在或已停用
        "429":
          description: 举报提交频率超限
    get:
      tags: [Abuse]
      summary: 查询管理员待处理举报队列
      description: 仅平台管理员可访问。
      parameters:
        - name: status
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 举报队列
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AbuseReport"
        "403":
          description: 当前账号不是平台管理员
  /api/v1/abuse/reports/{id}/resolve:
    post:
      tags: [Abuse]
      summary: 处理举报并选择下架或驳回
      description: 仅平台管理员可访问。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAbuseReportRequest"
      responses:
        "200":
          description: 处理后的举报
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbuseReport"
        "403":
          description: 当前账号不是平台管理员
        "404":
          description: 举报不存在
        "409":
          description: 举报已经处理
  /api/v1/abuse/blocked-domains:
    get:
      tags: [Abuse]
      summary: 查询目标域名黑名单
      description: 仅平台管理员可访问。
      responses:
        "200":
          description: 有效目标域名黑名单
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockedDomain"
        "403":
          description: 当前账号不是平台管理员
    post:
      tags: [Abuse]
      summary: 添加目标域名黑名单
      description: 仅平台管理员可访问。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBlockedDomainRequest"
      responses:
        "201":
          description: 已添加的目标域名规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedDomain"
        "403":
          description: 当前账号不是平台管理员
  /api/v1/abuse/blocked-domains/{id}:
    delete:
      tags: [Abuse]
      summary: 解除目标域名黑名单
      description: 仅平台管理员可访问。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已解除
        "403":
          description: 当前账号不是平台管理员
        "404":
          description: 黑名单规则不存在
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    WebhookID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateTrialLinkRequest:
      type: object
      additionalProperties: false
      required: [destination_url]
      properties:
        destination_url:
          type: string
          format: uri
        alias:
          type: string
        title:
          type: string
    TrialClaimResponse:
      type: object
      required: [claimed_links, claimed_clicks]
      properties:
        claimed_links:
          type: integer
        claimed_clicks:
          type: integer
    CreateLinkRequest:
      type: object
      additionalProperties: false
      required: [destination_url]
      properties:
        destination_url:
          type: string
          format: uri
        alias:
          type: string
        title:
          type: string
        redirect_code:
          type: integer
          enum: [301, 302]
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - links:read
              - links:write
              - analytics:read
        expires_at:
          type: string
          format: date-time
    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        url:
          type: string
          format: uri
          maxLength: 2048
          description: 本地演示允许 HTTP 和私网地址；默认只允许公网 HTTPS。
    WebhookEndpoint:
      type: object
      required:
        - id
        - name
        - url
        - status
        - failure_count
        - disabled_at
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        status:
          type: integer
          enum: [1, 2]
          description: 1 接收中，2 已停用
        failure_count:
          type: integer
        disabled_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateWebhookResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        secret:
          type: string
          description: 仅创建响应返回一次的 HMAC 签名 Secret。
    WebhookDelivery:
      type: object
      required:
        - id
        - event_id
        - event_type
        - status
        - attempt_count
        - next_attempt_at
        - response_status
        - last_error
        - delivered_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: string
        event_type:
          type: string
          enum: [link.created, link.updated, link.deleted]
        status:
          type: integer
          enum: [1, 2, 3, 4]
          description: 1 待投递，2 投递中，3 成功，4 终止
        attempt_count:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        response_status:
          type: [integer, "null"]
        last_error:
          type: string
        delivered_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateAbuseReportRequest:
      type: object
      additionalProperties: false
      required: [short_url, reason]
      properties:
        short_url:
          type: string
          maxLength: 2048
        reason:
          type: string
          enum: [phishing, malware, spam, impersonation, other]
        details:
          type: string
          maxLength: 1000
    CreateAbuseReportResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: integer
          enum: [1]
    ResolveAbuseReportRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [takedown, reject]
        note:
          type: string
          maxLength: 1000
    AbuseReport:
      type: object
      required:
        - id
        - link_id
        - link_title
        - link_slug
        - domain_hostname
        - destination_url
        - link_status
        - reason
        - details
        - status
        - resolution_note
        - resolved_at
        - created_at
      properties:
        id:
          type: string
        link_id:
          type: string
        link_title:
          type: string
        link_slug:
          type: string
        domain_hostname:
          type: string
        destination_url:
          type: string
          format: uri
        link_status:
          type: integer
          enum: [1, 2]
        reason:
          type: string
          enum: [phishing, malware, spam, impersonation, other]
        details:
          type: string
        status:
          type: integer
          enum: [1, 2, 3]
        resolution_note:
          type: string
        resolved_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    AddBlockedDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname, reason]
      properties:
        hostname:
          type: string
          maxLength: 253
        reason:
          type: string
          minLength: 1
          maxLength: 500
    BlockedDomain:
      type: object
      required: [id, hostname, reason, created_at]
      properties:
        id:
          type: string
        hostname:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
