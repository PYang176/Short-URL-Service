name: shorturl

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: short_url
      MYSQL_USER: short_url
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-short_url}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/migrate", "up"]
    environment:
      APP_ENV: development
      MYSQL_DSN: short_url:${MYSQL_PASSWORD:-short_url}@tcp(mysql:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci
      REDIS_ADDR: redis:6379
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      APP_ENV: development
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-production-123456}
      MYSQL_DSN: short_url:${MYSQL_PASSWORD:-short_url}@tcp(mysql:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci
      REDIS_ADDR: redis:6379
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      APP_ENV: development
      HTTP_ADDR: :8081
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-production-123456}
      MYSQL_DSN: short_url:${MYSQL_PASSWORD:-short_url}@tcp(mysql:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci
      REDIS_ADDR: redis:6379
    ports:
      - "${WORKER_PORT:-18081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
  redis_data:
