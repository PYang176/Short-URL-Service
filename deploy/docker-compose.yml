name: shorturl

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: shorturl-app:local
    command: ["/app/migrate", "up"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      MYSQL_DSN: "${MYSQL_DSN:?set MYSQL_DSN in deploy/.env}"
      ALLOW_MIGRATION_DOWN: ${ALLOW_MIGRATION_DOWN:-false}
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      ANALYTICS_HASH_SECRET: "${ANALYTICS_HASH_SECRET:?set ANALYTICS_HASH_SECRET in deploy/.env}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    image: shorturl-app:local
    command: ["/app/api"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18088}
      HTTP_ADDR: :8080
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      ANALYTICS_HASH_SECRET: "${ANALYTICS_HASH_SECRET:?set ANALYTICS_HASH_SECRET in deploy/.env}"
      DOMAIN_VERIFY_MODE: ${DOMAIN_VERIFY_MODE:-mock}
      CUSTOM_DOMAIN_CNAME: ${CUSTOM_DOMAIN_CNAME:-links.localhost}
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      MYSQL_DSN: "${MYSQL_DSN:?set MYSQL_DSN in deploy/.env}"
      REDIS_ADDR: "redis:6379"
      TRIAL_SESSION_TTL: ${TRIAL_SESSION_TTL:-24h}
      TRIAL_LINK_LIMIT: ${TRIAL_LINK_LIMIT:-3}
      TRIAL_CLEANUP_INTERVAL: ${TRIAL_CLEANUP_INTERVAL:-10m}
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: shorturl-app:local
    command: ["/app/worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8081
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      ANALYTICS_HASH_SECRET: "${ANALYTICS_HASH_SECRET:?set ANALYTICS_HASH_SECRET in deploy/.env}"
      DOMAIN_VERIFY_MODE: ${DOMAIN_VERIFY_MODE:-mock}
      CUSTOM_DOMAIN_CNAME: ${CUSTOM_DOMAIN_CNAME:-links.localhost}
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      MYSQL_DSN: "${MYSQL_DSN:?set MYSQL_DSN in deploy/.env}"
      REDIS_ADDR: "redis:6379"
      TRIAL_SESSION_TTL: ${TRIAL_SESSION_TTL:-24h}
      TRIAL_LINK_LIMIT: ${TRIAL_LINK_LIMIT:-3}
      TRIAL_CLEANUP_INTERVAL: ${TRIAL_CLEANUP_INTERVAL:-10m}
    ports:
      - "${WORKER_PORT:-18081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-18088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
