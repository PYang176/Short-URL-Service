name: shorturl

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: shorturl-app:local
    command: ["/app/migrate", "up"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      MYSQL_DSN: "${MYSQL_DSN:?set MYSQL_DSN in deploy/.env}"
      ALLOW_MIGRATION_DOWN: ${ALLOW_MIGRATION_DOWN:-false}
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      ANALYTICS_HASH_SECRET: "${ANALYTICS_HASH_SECRET:?set ANALYTICS_HASH_SECRET in deploy/.env}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    image: shorturl-app:local
    command: ["/app/api"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18088}
      HTTP_ADDR: :8080
      METRICS_ADDR: :9091
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      ANALYTICS_HASH_SECRET: "${ANALYTICS_HASH_SECRET:?set ANALYTICS_HASH_SECRET in deploy/.env}"
      DOMAIN_VERIFY_MODE: ${DOMAIN_VERIFY_MODE:-mock}
      CUSTOM_DOMAIN_CNAME: ${CUSTOM_DOMAIN_CNAME:-links.localhost}
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      MYSQL_DSN: "${MYSQL_DSN:?set MYSQL_DSN in deploy/.env}"
      REDIS_ADDR: "redis:6379"
      TRIAL_SESSION_TTL: ${TRIAL_SESSION_TTL:-24h}
      TRIAL_LINK_LIMIT: ${TRIAL_LINK_LIMIT:-3}
      TRIAL_CLEANUP_INTERVAL: ${TRIAL_CLEANUP_INTERVAL:-10m}
      WEBHOOK_POLL_INTERVAL: ${WEBHOOK_POLL_INTERVAL:-5s}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_REQUEST_TIMEOUT: ${WEBHOOK_REQUEST_TIMEOUT:-10s}
      WEBHOOK_LEASE: ${WEBHOOK_LEASE:-30s}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-true}
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: shorturl-app:local
    command: ["/app/worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8081
      METRICS_ADDR: :9091
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      ANALYTICS_HASH_SECRET: "${ANALYTICS_HASH_SECRET:?set ANALYTICS_HASH_SECRET in deploy/.env}"
      DOMAIN_VERIFY_MODE: ${DOMAIN_VERIFY_MODE:-mock}
      CUSTOM_DOMAIN_CNAME: ${CUSTOM_DOMAIN_CNAME:-links.localhost}
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      MYSQL_DSN: "${MYSQL_DSN:?set MYSQL_DSN in deploy/.env}"
      REDIS_ADDR: "redis:6379"
      TRIAL_SESSION_TTL: ${TRIAL_SESSION_TTL:-24h}
      TRIAL_LINK_LIMIT: ${TRIAL_LINK_LIMIT:-3}
      TRIAL_CLEANUP_INTERVAL: ${TRIAL_CLEANUP_INTERVAL:-10m}
      WEBHOOK_POLL_INTERVAL: ${WEBHOOK_POLL_INTERVAL:-5s}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_REQUEST_TIMEOUT: ${WEBHOOK_REQUEST_TIMEOUT:-10s}
      WEBHOOK_LEASE: ${WEBHOOK_LEASE:-30s}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-true}
    ports:
      - "${WORKER_PORT:-18081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-18088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
