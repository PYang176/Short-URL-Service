name: shorturl

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/migrate", "up"]
    environment:
      APP_ENV: development
      MYSQL_DSN: "${MYSQL_DSN:-short_url:short_url@tcp(host.docker.internal:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci}"
      REDIS_ADDR: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      APP_ENV: development
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-production-123456}
      ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:-dev-only-analytics-secret-change-in-production}
      MYSQL_DSN: "${MYSQL_DSN:-short_url:short_url@tcp(host.docker.internal:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci}"
      REDIS_ADDR: "redis:6379"
    ports:
      - "${API_PORT:-18080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      APP_ENV: development
      HTTP_ADDR: :8081
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-production-123456}
      ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:-dev-only-analytics-secret-change-in-production}
      MYSQL_DSN: "${MYSQL_DSN:-short_url:short_url@tcp(host.docker.internal:3306)/short_url?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_unicode_ci}"
      REDIS_ADDR: "redis:6379"
    ports:
      - "${WORKER_PORT:-18081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
